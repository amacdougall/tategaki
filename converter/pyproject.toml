[project]
name = "tategaki"
version = "0.1.0"
description = "EPUB to pre-rendered vertical-text bundles for the Tategaki Kindle reader"
authors = [
    { name = "Alan MacDougall", email = "smoke@alanmacdougall.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "playwright>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
tategaki = "tategaki.cli:main"
